[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-sync-agent"
version = "0.1.0"
description = "A terminal-based local markdown knowledge base and web clipper agent"
requires-python = ">=3.10"
dependencies = [
    "typer==0.24.1",
    "rich==14.3.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "langchain==1.3.2",
    "langchain-core==1.4.0",
    "langgraph==1.2.2",
    "langgraph-checkpoint==4.1.1",
    "langgraph-prebuilt==1.1.0",
    "langchain-mcp-adapters==0.3.0",
    "mcp==1.28.0",
    "httpx==0.28.1",
    "google-genai==2.10.0"
]
[project.scripts]
smart-sync = "cli:main"

[tool.hatch.build.targets.wheel]
include = [
    "/*.py"
]
