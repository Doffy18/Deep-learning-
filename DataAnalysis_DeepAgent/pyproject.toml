[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-data-analyst"
version = "0.1.0"
description = "An autonomous local data analysis and Slack reporting agent powered by the Model Context Protocol (MCP)"
requires-python = ">=3.10"
dependencies = [
    "typer==0.26.8",
    "rich==15.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "deepagents==0.6.12",
    "langchain==1.3.11",
    "langchain-core==1.4.8",
    "langgraph==1.2.7",
    "langgraph-checkpoint==4.1.1",
    "langgraph-prebuilt==1.1.0",
    "langchain-mcp-adapters==0.3.0",
    "mcp==1.28.1",
    "httpx==0.28.1",
    "google-genai==2.10.0",
    "langchain-google-genai==4.2.6",
    "pandas==3.0.3",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "slack-sdk==3.43.0"
]

[project.scripts]
analyst-mcp = "cli:main"

[tool.hatch.build.targets.wheel]
include = [
    "/*.py"
]